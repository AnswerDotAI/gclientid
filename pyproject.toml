[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gclientid"
dynamic = ["version"]
description = "Create personal Google OAuth clients and tokens locally"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{name = "Jeremy Howard", email = "github@jhoward.fastmail.fm"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = ["fastcdp>=0.0.11", "fastcore>=2.2.16", "google-auth>=2.57.0", "httpx2>=2.12.0", "pyskills>=0.0.29"]

[project.scripts]
gclientid = "gclientid.cli:main"
gclientid-auth = "gclientid.cli:auth"

[project.optional-dependencies]
dev = [
  "fastship",
  "build",
  "twine",
]

[project.urls]
Homepage = "https://github.com/AnswerDotAI/gclientid"

[tool.setuptools.dynamic]
version = { attr = "gclientid.__version__" }

[tool.setuptools.packages.find]
include = ["gclientid"]
